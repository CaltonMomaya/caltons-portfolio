<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Calton | Developer Universe OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --cosmic-primary: #0b0b2d;
            --cosmic-secondary: #1a1a3e;
            --neon-blue: #00f3ff;
            --neon-purple: #b967ff;
            --neon-pink: #ff2a9d;
            --star-glow: rgba(255, 255, 255, 0.8);
            --terminal-green: #00ff9d;
        }

        body {
            background: radial-gradient(ellipse at center, #050510 0%, #000000 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            font-family: 'Exo 2', sans-serif;
        }

        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: var(--star-glow);
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        /* Boot Screen */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        .boot-container {
            text-align: center;
            padding: 20px;
            animation: fadeIn 2s ease;
        }

        .boot-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 12vw, 3.5rem);
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 4px;
            animation: pulse 2s infinite;
        }

        .boot-subtitle {
            color: #aaa;
            margin-bottom: 40px;
            font-size: clamp(0.8rem, 4vw, 1rem);
        }

        .boot-btn {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            color: var(--cosmic-primary);
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
        }

        /* Main OS */
        #os-interface {
            display: none;
            min-height: 100vh;
            padding: 16px;
        }

        .desktop {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .desktop-icons-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 115px));
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .desktop-icon {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(20, 20, 60, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            transition: all 0.25s ease;
            padding: 12px;
        }

        .desktop-icon i {
            font-size: 2rem;
            color: var(--neon-purple);
            margin-bottom: 8px;
        }

        .desktop-icon span {
            font-size: 0.75rem;
            color: var(--neon-blue);
            font-weight: 600;
            text-align: center;
        }

        /* Windows */
        .window {
            position: fixed;
            background: rgba(8, 8, 28, 0.98);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1.5px solid var(--neon-blue);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.3);
            width: 90vw;
            max-width: 880px;
            height: auto;
            max-height: 80vh;
            display: none;
            z-index: 200;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            flex-direction: column;
            overflow: hidden;
            animation: fadeScale 0.25s ease;
        }

        @keyframes fadeScale {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.92);}
            to { opacity: 1; transform: translate(-50%, -50%) scale(1);}
        }

        .window-header {
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--neon-blue);
            display: flex;
            justify-content: space-between;
            cursor: grab;
        }

        .window-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--neon-blue);
        }

        .window-controls button {
            background: none;
            border: none;
            color: #ccc;
            font-size: 0.9rem;
            margin-left: 12px;
            cursor: pointer;
        }

        .window-content {
            padding: 18px;
            overflow-y: auto;
            flex: 1;
        }

        /* Project Grid */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .project-card {
            background: rgba(25, 25, 55, 0.8);
            border-radius: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            transition: 0.2s;
            overflow: hidden;
        }

        .project-thumbnail {
            height: 130px;
            background: linear-gradient(145deg, #0f3460, #1a0f3a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
        }

        .project-content {
            padding: 14px;
        }

        .project-title {
            color: var(--neon-blue);
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .project-tech {
            font-size: 0.7rem;
            color: #b967ff;
            word-break: break-word;
        }

        /* Skill Matrix - FIXED for mobile readability */
        .skill-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 14px;
            margin-top: 20px;
        }

        .skill-item {
            background: rgba(16, 16, 48, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid rgba(0, 243, 255, 0.3);
            transition: all 0.2s;
        }

        .skill-item i {
            font-size: 1.8rem;
            color: var(--neon-purple);
            margin-bottom: 8px;
            display: inline-block;
        }

        .skill-item h4 {
            font-size: 0.85rem;
            color: var(--neon-blue);
            margin: 6px 0 4px;
            font-weight: 600;
        }

        .skill-item span {
            font-size: 0.7rem;
            color: var(--terminal-green);
            background: rgba(0,255,157,0.1);
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Terminal - better mobile */
        .terminal {
            background: #01010c;
            border-radius: 18px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            height: 380px;
            overflow-y: auto;
            border: 1px solid var(--neon-blue);
        }

        .terminal-line {
            margin-bottom: 8px;
            font-size: 0.8rem;
            word-break: break-word;
            line-height: 1.4;
        }

        .terminal-prompt {
            color: var(--terminal-green);
            font-weight: bold;
        }

        .terminal-input {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            background: #00000055;
            padding: 8px;
            border-radius: 40px;
            border-top: 1px solid var(--neon-blue);
        }

        .terminal-input input {
            background: transparent;
            border: none;
            color: var(--terminal-green);
            font-family: monospace;
            font-size: 0.85rem;
            outline: none;
            flex: 1;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a2ae0;
            backdrop-filter: blur(12px);
            border-left: 4px solid var(--neon-blue);
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            display: none;
            z-index: 1200;
            width: max-content;
            max-width: 85vw;
            text-align: center;
            font-weight: 500;
            white-space: nowrap;
        }

        @media (max-width: 640px) {
            .notification { white-space: normal; width: auto; bottom: 16px; font-size: 0.7rem; padding: 8px 16px;}
            .window { width: 94vw; max-height: 75vh; }
            .desktop-icons-container { gap: 12px; }
            .skill-matrix { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; }
            .skill-item { padding: 10px 5px; }
            .skill-item i { font-size: 1.5rem; }
            .skill-item h4 { font-size: 0.75rem; }
            .terminal { height: 300px; }
        }

        @keyframes pulse { 0% { opacity: 0.9; } 50% { opacity: 1; text-shadow: 0 0 12px cyan; } 100% { opacity: 0.9; }}
        @keyframes twinkle { 0%,100%{ opacity:0.3;} 50%{ opacity:1;} }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    </style>
</head>
<body>
<div id="stars"></div>

<!-- Boot Screen -->
<div id="boot-screen">
    <div class="boot-container">
        <h1 class="boot-title">CALTON</h1>
        <p class="boot-subtitle">Developer Universe OS // v5.0</p>
        <button class="boot-btn" id="bootBtn">⟳ OPEN PORTFOLIO</button>
        <div style="margin-top: 32px; color: #5f5f9e; font-size: 0.7rem;">Full Stack • AI • Cross-Platform</div>
    </div>
</div>

<!-- Main OS -->
<div id="os-interface">
    <div class="desktop">
        <div style="text-align:center;">
            <h2 style="color:var(--neon-blue); font-family:'Orbitron'; font-size: clamp(1.5rem, 6vw, 2rem);">CALTON MOMAYA</h2>
            <p style="color:#bbb; font-size:0.9rem;">Full Stack Architect & Creator</p>
        </div>
        <div class="desktop-icons-container">
            <div class="desktop-icon" data-window="projects"><i class="fas fa-cubes"></i><span>Projects</span></div>
            <div class="desktop-icon" data-window="resume"><i class="fas fa-terminal"></i><span>Terminal</span></div>
            <div class="desktop-icon" data-window="skills"><i class="fas fa-chart-simple"></i><span>Skill Matrix</span></div>
            <div class="desktop-icon" data-window="contact"><i class="fas fa-paper-plane"></i><span>Contact</span></div>
            <div class="desktop-icon" onclick="window.open('https://github.com/CaltonMomaya', '_blank')"><i class="fab fa-github"></i><span>GitHub</span></div>
        </div>
    </div>

    <!-- PROJECTS WINDOW -->
    <div class="window" id="projects-window">
        <div class="window-header"><div class="window-title">🚀 PROJECT NEXUS</div><div class="window-controls"><button class="close-btn"><i class="fas fa-times"></i></button><button class="maximize-btn"><i class="fas fa-expand"></i></button></div></div>
        <div class="window-content"><h3 style="color:var(--neon-blue); margin-bottom:12px;">⚡ Featured Systems</h3><div class="project-grid" id="project-grid"></div></div>
    </div>

    <!-- RESUME TERMINAL WINDOW -->
    <div class="window" id="resume-window">
        <div class="window-header"><div class="window-title">⌨️ RESUME TERMINAL</div><div class="window-controls"><button class="close-btn"><i class="fas fa-times"></i></button><button class="maximize-btn"><i class="fas fa-expand"></i></button></div></div>
        <div class="window-content"><div class="terminal" id="terminal"><div id="terminal-output"></div><div class="terminal-input"><span class="terminal-prompt">⚡ calton@dev:~$</span><input type="text" id="terminal-input" autocomplete="off"></div></div></div>
    </div>

    <!-- SKILL MATRIX WINDOW (optimized) -->
    <div class="window" id="skills-window">
        <div class="window-header"><div class="window-title">🧠 SKILL MATRIX</div><div class="window-controls"><button class="close-btn"><i class="fas fa-times"></i></button><button class="maximize-btn"><i class="fas fa-expand"></i></button></div></div>
        <div class="window-content"><div class="skill-matrix" id="skill-matrix"></div></div>
    </div>

    <div class="notification" id="notification"><span id="notification-message"></span></div>
</div>

<script>
    // Starfield
    function createStars() {
        const container = document.getElementById('stars');
        for(let i=0;i<200;i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random()*2+1}px`;
            star.style.height = star.style.width;
            star.style.left = `${Math.random()*100}%`;
            star.style.top = `${Math.random()*100}%`;
            star.style.animationDuration = `${Math.random()*3+2}s`;
            star.style.opacity = 0.5 + Math.random() * 0.5;
            container.appendChild(star);
        }
    }

    const notification = (msg, type = "info") => {
        const notif = document.getElementById('notification');
        notif.querySelector('#notification-message').innerHTML = `✨ ${msg}`;
        notif.style.display = 'block';
        setTimeout(() => notif.style.display = 'none', 2200);
    };

    // boot
    document.getElementById('bootBtn').addEventListener('click', () => {
        const bootScreen = document.getElementById('boot-screen');
        bootScreen.style.opacity = '0';
        setTimeout(() => {
            bootScreen.style.display = 'none';
            document.getElementById('os-interface').style.display = 'block';
            loadProjects(); 
            loadSkills();   
            loadResumeTerminal();
            notification("System Online • Welcome Calton Universe");
        }, 700);
    });

    // ---------- LOAD PROJECTS (includes EduGate, EarthLungs, Smart Waiter) ----------
    function loadProjects() {
        const projects = [
            { title: "EduGate Learning Hub", desc: "AI-driven adaptive micro-learning platform with real-time progress & certification engine.", tech: "React • Node.js • MongoDB • OpenAI", icon: "fas fa-graduation-cap" },
            { title: "EarthLungs Reforest", desc: "Global carbon & reforestation tracking, satellite data and community-driven impact metrics.", tech: "Vue • Python • PostgreSQL • Mapbox GL", icon: "fas fa-tree" },
            { title: "Smart Waiter Ordering", desc: "QR-based intelligent ordering with live kitchen dashboard & real-time analytics for restaurants.", tech: "Flutter • Firebase • Express • Socket.io", icon: "fas fa-utensils" },
            { title: "Quantum Commerce", desc: "Next-gen e-commerce with crypto payments + AR product preview.", tech: "Next.js • Solidity • Stripe • IPFS", icon: "fas fa-cart-shopping" },
            { title: "Neural Health AI", desc: "Predictive analytics dashboard for IoT health devices and patient alerts.", tech: "TensorFlow • FastAPI • React Native", icon: "fas fa-heartbeat" },
            { title: "CodeCollab Studio", desc: "Real-time AI pair programming with voice & WebRTC.", tech: "WebRTC • Python • Vue • Redis", icon: "fas fa-code-branch" }
        ];
        const grid = document.getElementById('project-grid');
        if(grid) {
            grid.innerHTML = '';
            projects.forEach(p => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-thumbnail"><i class="${p.icon} fa-3x"></i></div>
                    <div class="project-content">
                        <h3 class="project-title">${p.title}</h3>
                        <p style="color:#bbb; font-size:0.8rem; margin-bottom:8px;">${p.desc}</p>
                        <div class="project-tech"><i class="fas fa-microchip"></i> ${p.tech}</div>
                    </div>
                `;
                card.addEventListener('click', () => notification(`${p.title} • Project highlight`));
                grid.appendChild(card);
            });
        }
    }

    // ---------------- SKILL MATRIX (enhanced, responsive, clean mobile view) ----------------
    function loadSkills() {
        const skillsList = [
            { icon: "fab fa-js", name: "JavaScript/TS", level: "Expert" },
            { icon: "fab fa-react", name: "React/Vue", level: "Expert" },
            { icon: "fab fa-node-js", name: "Node.js", level: "Expert" },
            { icon: "fab fa-python", name: "Python", level: "Advanced" },
            { icon: "fas fa-database", name: "MongoDB/SQL", level: "Advanced" },
            { icon: "fab fa-docker", name: "Docker/K8s", level: "Advanced" },
            { icon: "fab fa-java", name: "Java/Kotlin", level: "Intermediate" },
            { icon: "fab fa-aws", name: "AWS/GCP", level: "Advanced" },
            { icon: "fab fa-git-alt", name: "Git/GitHub", level: "Expert" },
            { icon: "fas fa-mobile-alt", name: "Flutter", level: "Advanced" },
            { icon: "fas fa-chart-line", name: "Data Eng", level: "Advanced" },
            { icon: "fas fa-cloud", name: "DevOps", level: "Advanced" }
        ];
        const matrixDiv = document.getElementById('skill-matrix');
        if(matrixDiv) {
            matrixDiv.innerHTML = '';
            skillsList.forEach(skill => {
                const el = document.createElement('div');
                el.className = 'skill-item';
                el.innerHTML = `<i class="${skill.icon}"></i><h4>${skill.name}</h4><span>${skill.level}</span>`;
                el.addEventListener('click', () => notification(`${skill.name} : ${skill.level}`));
                matrixDiv.appendChild(el);
            });
        }
    }

    // ------------------ TERMINAL RESUME + FUNCTIONALITY ------------------
    let termHistory = [], histIndex = -1;
    const termOutput = document.getElementById('terminal-output');
    function addLine(text, type = "output") {
        if(!termOutput) return;
        const lineDiv = document.createElement('div');
        lineDiv.className = 'terminal-line';
        if(type === "command") lineDiv.innerHTML = `<span class="terminal-prompt">⚡ calton@dev:~$</span> ${text}`;
        else if(type === "system") lineDiv.innerHTML = `<span style="color:#00f3ff;">🖥️ ${text}</span>`;
        else if(type === "error") lineDiv.innerHTML = `<span style="color:#ff2a9d;">⚠️ ${text}</span>`;
        else if(type === "header") lineDiv.innerHTML = `<span style="color:#00ff9d; font-weight:bold;">${text}</span>`;
        else lineDiv.innerHTML = `<span>${text}</span>`;
        termOutput.appendChild(lineDiv);
        termOutput.scrollTop = termOutput.scrollHeight;
    }

    function processCommand(cmd) {
        const c = cmd.toLowerCase().trim();
        if(c === "help") {
            addLine("Available: about, skills, projects, contact, github, clear", "system");
        } else if(c === "about") {
            addLine("Calton Momaya — Full Stack Architect, 6+ years, building scalable digital experiences.", "header");
        } else if(c === "skills") {
            addLine("◉ Frontend: React, Vue, Angular, TypeScript", "output");
            addLine("◉ Backend: Node.js, Python, Java, GraphQL", "output");
            addLine("◉ Databases: MongoDB, PostgreSQL, Firebase", "output");
            addLine("◉ Cloud/DevOps: AWS, Docker, Kubernetes", "output");
        } else if(c === "projects") {
            addLine("📌 EduGate • EarthLungs • Smart Waiter • Quantum Commerce • Neural Health", "output");
        } else if(c === "contact") {
            addLine("📧 Email: calton@devuniverse.tech", "output");
            addLine("🐙 GitHub: /CaltonMomaya   💼 LinkedIn: /in/calton-momaya", "output");
        } else if(c === "github") {
            addLine("Opening GitHub repository...", "system");
            setTimeout(() => window.open('https://github.com/CaltonMomaya', '_blank'), 300);
        } else if(c === "clear") {
            if(termOutput) termOutput.innerHTML = '';
        } else {
            addLine(`Command not found: ${cmd}. Try 'help'`, "error");
        }
    }

    function loadResumeTerminal() {
        if(termOutput) termOutput.innerHTML = '';
        const initLines = [
            { text: "══════════════════════════════════════════", type: "system" },
            { text: "CALTON MOMAYA • FULL STACK ARCHITECT", type: "header" },
            { text: "══════════════════════════════════════════", type: "system" },
            { text: "> 6+ years of full-stack & system design experience", type: "output" },
            { text: "> 45+ production-grade projects | AI, Fintech, GreenTech", type: "output" },
            { text: "> Type 'help' to explore interactive resume terminal", type: "system" }
        ];
        initLines.forEach((line, idx) => {
            setTimeout(() => addLine(line.text, line.type), idx * 70);
        });
    }

    // ------ WINDOW MANAGEMENT (drag, close, maximize, zIndex) ------
    const windows = document.querySelectorAll('.window');
    let currentZ = 300;
    let dragActive = false, dragWin = null, dragStart = { x:0, y:0 }, winStartPos = { left:0, top:0 };

    function bringToFront(win) {
        win.style.zIndex = ++currentZ;
    }

    function openWindowById(winId) {
        const win = document.getElementById(`${winId}-window`);
        if(!win) return;
        win.style.display = 'flex';
        bringToFront(win);
        win.style.transform = 'translate(-50%, -50%)';
        win.style.top = '50%';
        win.style.left = '50%';
        if(winId === 'resume') setTimeout(() => document.getElementById('terminal-input')?.focus(), 80);
        if(winId === 'projects') loadProjects();
        if(winId === 'skills') loadSkills();
        notification(`Opened: ${winId}`, "info");
    }

    document.querySelectorAll('.desktop-icon[data-window]').forEach(icon => {
        icon.addEventListener('click', (e) => {
            const winId = icon.getAttribute('data-window');
            if(winId === 'contact') {
                notification("📬 Contact: calton@devuniverse.tech | GitHub: CaltonMomaya", "info");
                return;
            }
            openWindowById(winId);
        });
    });

    windows.forEach(win => {
        const header = win.querySelector('.window-header');
        const closeBtn = win.querySelector('.close-btn');
        const maxBtn = win.querySelector('.maximize-btn');
        let isMax = false;

        if(closeBtn) closeBtn.addEventListener('click', () => {
            win.style.display = 'none';
            notification("Window closed");
        });
        if(maxBtn) maxBtn.addEventListener('click', () => {
            if(!isMax) {
                win.style.width = '93vw';
                win.style.height = '82vh';
                win.style.top = '50%';
                win.style.left = '50%';
                win.style.transform = 'translate(-50%, -50%)';
                isMax = true;
            } else {
                win.style.width = '';
                win.style.height = '';
                win.style.top = '50%';
                win.style.left = '50%';
                win.style.transform = 'translate(-50%, -50%)';
                isMax = false;
            }
        });

        header.addEventListener('mousedown', (e) => {
            if(e.target.closest('.window-controls')) return;
            dragWin = win;
            dragActive = true;
            const rect = win.getBoundingClientRect();
            winStartPos.left = rect.left;
            winStartPos.top = rect.top;
            dragStart.x = e.clientX - rect.left;
            dragStart.y = e.clientY - rect.top;
            win.style.transition = 'none';
            win.style.transform = 'none';
            win.style.left = `${winStartPos.left}px`;
            win.style.top = `${winStartPos.top}px`;
            bringToFront(win);
        });
    });

    document.addEventListener('mousemove', (e) => {
        if(!dragActive || !dragWin) return;
        let newLeft = e.clientX - dragStart.x;
        let newTop = e.clientY - dragStart.y;
        newLeft = Math.min(window.innerWidth - 60, Math.max(0, newLeft));
        newTop = Math.min(window.innerHeight - 80, Math.max(0, newTop));
        dragWin.style.left = `${newLeft}px`;
        dragWin.style.top = `${newTop}px`;
    });
    document.addEventListener('mouseup', () => {
        if(dragWin) dragWin.style.transition = '';
        dragActive = false;
        dragWin = null;
    });

    // Terminal input handler
    const inputField = document.getElementById('terminal-input');
    if(inputField) {
        inputField.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                const command = inputField.value.trim();
                if(command === "") return;
                addLine(command, "command");
                processCommand(command);
                termHistory.push(command);
                histIndex = termHistory.length;
                inputField.value = '';
            } else if(e.key === 'ArrowUp') {
                e.preventDefault();
                if(termHistory.length && histIndex > 0) {
                    histIndex--;
                    inputField.value = termHistory[histIndex];
                }
            } else if(e.key === 'ArrowDown') {
                e.preventDefault();
                if(termHistory.length && histIndex < termHistory.length-1) {
                    histIndex++;
                    inputField.value = termHistory[histIndex];
                } else if(histIndex === termHistory.length-1) {
                    histIndex++;
                    inputField.value = '';
                }
            }
        });
    }

    // Optional: touch support for mobile drag (basic)
    let touchMoved = false;
    document.querySelectorAll('.window-header').forEach(header => {
        header.addEventListener('touchstart', (e) => {
            if(e.target.closest('.window-controls')) return;
            const win = header.closest('.window');
            if(!win) return;
            dragWin = win;
            dragActive = true;
            const rect = win.getBoundingClientRect();
            winStartPos.left = rect.left;
            winStartPos.top = rect.top;
            const touch = e.touches[0];
            dragStart.x = touch.clientX - rect.left;
            dragStart.y = touch.clientY - rect.top;
            win.style.transition = 'none';
            win.style.transform = 'none';
            win.style.left = `${winStartPos.left}px`;
            win.style.top = `${winStartPos.top}px`;
            bringToFront(win);
            e.preventDefault();
        });
    });
    document.addEventListener('touchmove', (e) => {
        if(!dragActive || !dragWin) return;
        const touch = e.touches[0];
        let newLeft = touch.clientX - dragStart.x;
        let newTop = touch.clientY - dragStart.y;
        newLeft = Math.min(window.innerWidth - 60, Math.max(0, newLeft));
        newTop = Math.min(window.innerHeight - 80, Math.max(0, newTop));
        dragWin.style.left = `${newLeft}px`;
        dragWin.style.top = `${newTop}px`;
        touchMoved = true;
    });
    document.addEventListener('touchend', () => {
        if(dragWin) dragWin.style.transition = '';
        dragActive = false;
        dragWin = null;
        touchMoved = false;
    });

    createStars();
</script>
</body>
</html>
